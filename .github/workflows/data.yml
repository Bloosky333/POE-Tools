# Hourly data job: refreshes poe.ninja prices and currency-exchange flips, commits the daily
# history to the orphan `data` branch, builds the site with fresh data and deploys it to
# GitHub Pages (main only). Runs on other branches only build with fresh data: they never
# write the shared history.
name: Data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches-ignore: [data]
    paths:
      - apps/web/**
      - packages/data-job/src/**
      - packages/shared/src/**
      - .github/workflows/data.yml

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data-store FETCH_HEAD
          else
            git worktree add --orphan -b data data-store
          fi

      # Rolling 24 h window of GGG exchange data (flipping tool): kept in the Actions cache,
      # not committed. A missing cache only costs a rebuild from the feed (24 requests).
      - name: Restore exchange window
        uses: actions/cache/restore@v4
        with:
          path: exchange-window
          key: exchange-window-${{ github.run_id }}
          restore-keys: exchange-window-

      - name: Run data job
        id: job
        run: >-
          pnpm job --data-dir "$GITHUB_WORKSPACE/data-store"
          --out "$GITHUB_WORKSPACE/apps/web/public/data"
          --exchange-dir "$GITHUB_WORKSPACE/exchange-window"

      - name: Save exchange window
        if: always() && hashFiles('exchange-window/**') != ''
        uses: actions/cache/save@v4
        with:
          path: exchange-window
          key: exchange-window-${{ github.run_id }}

      # Committed even when the job failed: a league only writes the store once it is
      # complete, so what the other leagues (and games) fetched is kept.
      - name: Commit data
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.job.outcome != 'skipped' }}
        working-directory: data-store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data $(date -u +%F)"
            git push origin HEAD:refs/heads/data
          fi

      - run: pnpm --filter @poe-tools/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
