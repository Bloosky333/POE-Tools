# Hourly data job: refreshes poe.ninja prices, commits the daily history to the orphan
# `data` branch, builds the site with fresh data and deploys it to GitHub Pages (main only).
name: Data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches-ignore: [data]
    paths:
      - packages/data-job/src/**
      - packages/shared/src/**
      - .github/workflows/data.yml

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data-store FETCH_HEAD
          else
            git worktree add --orphan -b data data-store
          fi

      - name: Run data job
        run: pnpm job --data-dir "$GITHUB_WORKSPACE/data-store" --out "$GITHUB_WORKSPACE/apps/web/public/data"

      - name: Commit data
        working-directory: data-store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data $(date -u +%F)"
            git push origin HEAD:refs/heads/data
          fi

      - run: pnpm --filter @poe-tools/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
