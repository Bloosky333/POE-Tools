# Capture real poe.ninja / GGG currency-exchange responses (unreachable from the dev
# sandbox) and commit them as fixtures to the branch it runs on. Small and manual only
# (Actions → poe.ninja probe → Run workflow).
name: poe.ninja probe

on:
  workflow_dispatch:
    inputs:
      source:
        description: What to probe
        type: choice
        options: [exchange, ninja, base-items, poe1, crafting]
        default: exchange
      game:
        description: Game (base-items, crafting)
        type: choice
        options: [poe2, poe1]
        default: poe2

concurrency:
  group: probe-${{ github.ref }}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.source == 'ninja'
        run: pnpm probe
      - if: inputs.source == 'exchange'
        run: pnpm probe:exchange
      - if: inputs.source == 'base-items'
        run: pnpm probe:base-items
        env:
          GAME: ${{ inputs.game }}
      - if: inputs.source == 'poe1'
        run: pnpm probe:poe1
      - if: inputs.source == 'crafting'
        run: pnpm probe:crafting
        env:
          GAME: ${{ inputs.game }}
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p fixtures/poe-ninja/probe fixtures/ggg-exchange/probe fixtures/poe1 packages/data-job/data packages/shared/data
          git add fixtures/poe-ninja/probe fixtures/ggg-exchange/probe fixtures/poe1 packages/data-job/data packages/shared/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update ${{ inputs.source }} probe fixtures"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
